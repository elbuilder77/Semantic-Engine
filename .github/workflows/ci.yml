name: SES Semantic Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: portal/package-lock.json

    - name: Install Portal Dependencies
      run: npm ci --prefix portal

    - name: Validate Portal
      run: |
        npm --prefix portal run lint
        npm --prefix portal run test
        npm --prefix portal run build

  test-and-build:
    name: Python Test & Rust Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Validate Local Dependency Compose
      run: |
        QDRANT_API_KEY="$(openssl rand -hex 16)" \
        REDIS_PASSWORD="$(openssl rand -hex 16)" \
        docker compose --env-file .env.compose.example config --quiet

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo Dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          core_rs/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('core_rs/Cargo.lock') }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,server]
        python -m pip install "maturin>=1,<2"

    - name: Code Style Check (Linter)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ses/ tests/ gateway/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 ses/ tests/ gateway/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Validate and Build Rust Wheel (PyO3)
      run: |
        cargo fmt --manifest-path core_rs/Cargo.toml -- --check
        cargo test --manifest-path core_rs/Cargo.toml
        cargo clippy --manifest-path core_rs/Cargo.toml --all-targets -- -D warnings
        python -m maturin build --release --manifest-path core_rs/Cargo.toml --interpreter python --out core_rs/target/wheels
        python -m pip install --force-reinstall core_rs/target/wheels/*.whl
        python -c "import numpy as np, jas_vector_core as j; q=np.array([1.0,0.0],dtype=np.float32); d=np.array([[0.0,1.0],[1.0,0.0]],dtype=np.float32); assert j.cosine_similarity_search_numpy(q,d,1)[0][0] == 1"

    - name: Run Test Suite (Pytest)
      env:
        DEBUG: "true"
        VALID_API_KEYS: '{"personal_default": {"tier": "internal", "active": true}, "ses_internal_master_001": {"tier": "internal", "active": true}}'
      run: |
        pytest --cov=ses --cov-report=xml -m "not integration"

    - name: Run Bounded Synthetic Performance Smoke
      env:
        DEBUG: "true"
      run: |
        python -c "import sys; sys.path.insert(0, 'tests/performance'); import benchmark; benchmark.benchmark_search(num_documents=1000, dimensions=384, top_k=10, iterations=3); benchmark.benchmark_streaming_scan(num_files=100)"

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-and-build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Docker Compose
      run: |
        # Docker Compose v2 is already installed on ubuntu-latest runners
        docker compose version

    - name: Generate test credentials
      id: creds
      run: |
        echo "QDRANT_API_KEY=$(openssl rand -hex 16)" >> $GITHUB_OUTPUT
        echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_OUTPUT

    - name: Prepare environment file
      run: |
        cat > .env.compose <<EOF
        QDRANT_API_KEY=${{ steps.creds.outputs.QDRANT_API_KEY }}
        REDIS_PASSWORD=${{ steps.creds.outputs.REDIS_PASSWORD }}
        EOF

    - name: Start services
      run: |
        docker compose -f docker-compose.yml --env-file .env.compose up -d
        # Wait for services to become healthy (max 60 seconds)
        echo "Waiting for services to be healthy..."
        for i in {1..60}; do
          if docker compose -f docker-compose.yml --env-file .env.compose exec -T qdrant curl -sf http://localhost:6333/health > /dev/null 2>&1 && \
             docker compose -f docker-compose.yml --env-file .env.compose exec -T redis redis-cli -a "$${REDIS_PASSWORD}" ping > /dev/null 2>&1 && \
             docker compose -f docker-compose.yml --env-file .env.compose exec -T ollama ollama list > /dev/null 2>&1; then
            echo "All services healthy"
            break
          fi
          echo "Waiting for services... ($i/60)"
          sleep 1
        done
        # Final check
        docker compose -f docker-compose.yml --env-file .env.compose ps

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run integration tests
      env:
        DEBUG: "true"
        QDRANT_API_KEY: ${{ steps.creds.outputs.QDRANT_API_KEY }}
        REDIS_PASSWORD: ${{ steps.creds.outputs.REDIS_PASSWORD }}
        OLLAMA_BASE_URL: http://localhost:11434
        OLLAMA_MODEL: llama3.2
      run: |
        pytest --cov=ses --cov-report=xml -m integration tests/integration/

    - name: Tear down services
      if: always()
      run: |
        docker compose -f docker-compose.yml --env-file .env.compose down -v
