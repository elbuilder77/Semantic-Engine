name: SES Semantic Engine CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    services:
      # Optional: In case real integration tests are added later,
      # but currently tests are 100% mocked, so service containers are not strictly needed.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          core_rs/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('core_rs/Cargo.lock') }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .[dev,server]



    - name: Code Style Check (Linter)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ses/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 ses/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Compile Rust Core (PyO3)
      run: |
        cd core_rs
        cargo build --release
        # Copy compiled shared library so Python tests can load it
        cp target/release/libjas_vector_core.so ../jas_vector_core.so || cp target/release/libjas_vector_core.dylib ../jas_vector_core.so || cp target/release/jas_vector_core.dll ../jas_vector_core.so

    - name: Run Test Suite (Pytest)
      env:
        DEBUG: "true"
        VALID_API_KEYS: '{"personal_default": {"tier": "internal", "active": true}, "ses_internal_master_001": {"tier": "internal", "active": true}}'
      run: |
        pytest --cov=ses --cov-report=xml

    - name: Verify Performance Benchmark
      run: |
        python tests/performance/benchmark.py

