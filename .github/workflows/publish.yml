name: Package and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      run: >-
        python -m pip install --upgrade pip build twine

    - name: Build package (sdist and wheel)
      run: >-
        python -m build

    - name: Check package
      run: >-
        twine check dist/*

    - name: Upload verified distributions
      uses: actions/upload-artifact@v7
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error

  publish:
    name: Publish Verified Distribution
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ses-core
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Download verified distributions
      uses: actions/download-artifact@v8
      with:
        name: python-distributions
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
