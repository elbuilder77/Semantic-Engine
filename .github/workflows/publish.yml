name: Package and Publish Core (PyPI & Crates.io)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pypi:
    name: Build & Verify PyPI Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      run: >-
        python -m pip install --upgrade pip build twine

    - name: Verify Release Tag Parity
      if: github.event_name == 'release'
      run: |
        TAG_NAME="${{ github.event.release.tag_name }}"
        VERSION_FROM_TAG="${TAG_NAME#v}"
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "Release tag: $TAG_NAME (normalized: $VERSION_FROM_TAG)"
        echo "pyproject.toml version: $PKG_VERSION"
        if [ "$VERSION_FROM_TAG" != "$PKG_VERSION" ]; then
          echo "::error::Release tag version '$VERSION_FROM_TAG' does not match pyproject.toml version '$PKG_VERSION'."
          exit 1
        fi

    - name: Build package (sdist and wheel)
      run: >-
        python -m build

    - name: Check package
      run: >-
        twine check dist/*

    - name: Upload verified distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error

  publish-pypi:
    name: Publish ses-core to PyPI
    if: github.event_name == 'release'
    needs: build-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ses-core
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Download verified distributions
      uses: actions/download-artifact@v4
      with:
        name: python-distributions
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

  publish-crates:
    name: Publish jas_vector_core to Crates.io
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev python3-dev

    - name: Verify Crate
      run: cargo check --manifest-path core_rs/Cargo.toml

    - name: Publish to Crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      if: env.CARGO_REGISTRY_TOKEN != ''
      run: |
        cargo publish --manifest-path core_rs/Cargo.toml --token "$CARGO_REGISTRY_TOKEN"
