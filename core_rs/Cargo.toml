[package]
name = "jas_vector_core"
version = "0.1.0"
edition = "2021"
authors = ["Julio Patron <juliopc92@gmail.com>"]
description = "High-performance vector cosine similarity search and re-ranking core in Rust with PyO3 bindings"
license = "GPL-3.0-only"
repository = "https://github.com/elbuilder77/Semantic-Engine"
readme = "README.md"
keywords = ["vector", "cosine-similarity", "rag", "pyo3", "search"]
categories = ["algorithms", "science", "api-bindings"]

[lib]
name = "jas_vector_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
numpy = "0.28.0"
